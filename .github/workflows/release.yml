name: Release

# Maintainer-triggered only. This workflow runs no pull-request code and does
# not publish: it uploads bundles for a person to review and promote. macOS
# bundles are signed with the Apple secrets only when they exist; otherwise they
# are ad-hoc signed (no identity, not notarized). Windows bundles are not signed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Bundle (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis
    env:
      ORBYN_TARGET: ${{ matrix.target }}
      ORBYN_UPDATE_PUBKEY: ${{ vars.ORBYN_UPDATE_PUBKEY }}
      ORBYN_UPDATE_ENDPOINT: ${{ vars.ORBYN_UPDATE_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare-bundle
        working-directory: desktop
      - name: Build the bundles
        working-directory: desktop
        shell: bash
        run: |
          # Apple: with secrets, Tauri signs with them (unchanged). Without them, sign the whole
          # bundle ad-hoc ("-") during the build so the .app, the dmg and the updater archive
          # all carry a valid seal. Empty secret variables are cleared first.
          mac=''
          if [ "$RUNNER_OS" = macOS ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            mac=',"macOS":{"signingIdentity":"-","hardenedRuntime":false}'
            echo "No Apple signing identity: ad-hoc signing the macOS bundle."
          fi
          # Updater files need both the update public key and the signing private key.
          upd=false
          plugins=''
          if [ -n "${ORBYN_UPDATE_PUBKEY:-}" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            upd=true
            plugins=',"plugins":{"updater":{"pubkey":"'"$ORBYN_UPDATE_PUBKEY"'"}}'
          else
            echo "No updater key pair: building without updater files."
          fi
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":'"$upd$mac"'}'"$plugins"'}'
      - name: Verify the macOS bundle seal
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        # Fails the job when the .app, or the .app inside the dmg, does not verify, so a
        # bundle that macOS would call damaged is never uploaded. The dmg may carry a licence
        # agreement (bundle.licenseFile), so attach answers it from stdin.
        run: |
          bundle="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          for app in "$bundle"/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          mnt=''
          detach() {
            if [ -n "$mnt" ]; then
              hdiutil detach "$mnt" > /dev/null || hdiutil detach -force "$mnt" > /dev/null || true
              mnt=''
            fi
          }
          trap detach EXIT
          for dmg in "$bundle"/dmg/*.dmg; do
            mnt="$(mktemp -d)"
            printf 'Y\n' | hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
            status=0
            for app in "$mnt"/*.app; do
              codesign --verify --deep --strict --verbose=2 "$app" || status=1
            done
            detach
            [ "$status" = 0 ] || exit 1
          done
      - name: Check notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          scripts/verify-macos-release.sh "$bundle"/macos/*.app "$bundle"/dmg/*.dmg
      - name: Report Windows signing state
        if: runner.os == 'Windows'
        shell: bash
        # This step signs nothing. There is no Authenticode signing step yet, so the
        # NSIS installer is unsigned whether or not the Azure variables are set.
        env:
          AZURE_CODESIGN_ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
        run: |
          if [ -n "$AZURE_CODESIGN_ENDPOINT" ]; then
            echo "::warning::Azure variables are set, but no signing step exists yet. The Windows installer is NOT signed."
          else
            echo "::warning::Azure signing variables are absent. The Windows installer is NOT signed."
          fi
      - name: Pack the command for install.sh and install.ps1
        shell: bash
        run: node scripts/pack-cli.mjs ${{ matrix.target }} "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
      - name: Write checksums and inventory
        shell: bash
        run: |
          bundle="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.tar.gz' -o -name '*.sig' -o -name 'orbyn-cli-*.sha256' \) -print0 > assets
          xargs -0 node scripts/release-evidence.mjs release-evidence < assets
          xargs -0 -I{} cp {} release-evidence/ < assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 14
