name: Title
# Checks that the pull request title says what kind of change it is, in the form
# `type(scope): summary`. It reads the title from the event and runs the pull
# request's checker and tests. Issue titles use the same form; the issue forms
# start them off, and nothing gates an issue on it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    name: Pull request title
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Local runner only when the repository variable CI_RUNNER is 'local', the pull request is not from a fork and the actor is not Dependabot. A pull request can still edit this expression for its own run: the real controls are the runner group's repository access and the fork approval policy.
    runs-on: ${{ (vars.CI_RUNNER == 'local' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]') && fromJSON('["self-hosted","orbyn-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 2
    steps:
      # Check out `scripts/` from the pull request to test and run its checker.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check the title checker
        run: python3 scripts/test_check_title.py
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_title.py --kind pull-request --title "$TITLE"
