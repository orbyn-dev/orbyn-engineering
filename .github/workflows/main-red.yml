name: Main red

# Opens one issue labelled `ci: main red` when the CI run on main fails, comments on it for
# each further red run, and closes it when a run on main is green again. Nothing alerted
# before: E2E stayed red for 11 pushes unnoticed. The logic is scripts/main_red.py, which
# reads the run by id (so a rerun that went green counts as green) and ignores any run that
# is not on main or is a pull request run.
# Two guards keep it quiet: a first attempt that failed on a macOS desktop job waits for the
# rerun ci-retry.yml starts, and an older run that goes green does not close the issue while a
# newer run on main is red.
# Prove it on a past run without writing anything: run this workflow by hand with a run_id
# and dry_run left true; it prints the actions it would take.
# workflow_run workflows run from the default branch, so this takes effect after merge.
# Never checks out or runs pull request code: only the default branch's scripts folder.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Id of a finished CI run on main
        required: true
        type: string
      dry_run:
        description: Print the actions instead of taking them
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: main-red
  cancel-in-progress: false

jobs:
  alert:
    name: Alert when main is red
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - shell: bash
        run: |
          set -euo pipefail
          flag=()
          if [ "$DRY_RUN" = true ]; then flag=(--dry-run); fi
          python3 scripts/main_red.py --run-id "$RUN_ID" "${flag[@]}"
