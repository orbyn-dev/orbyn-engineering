name: Contributor licence agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  cla:
    uses: orbyn-dev/.github/.github/workflows/cla.yml@59d7fc7d24c490fd855c424de192638ee7e35d4d
    with:
      agreement-version: "0.1"
      # Account ids that never need to agree: Anh, dependabot, github-actions, and luannn010
      # (Anh waived the agreement for him, 2026-11-08).
      allowed: "63905487,49699333,41898282,103078945"
    secrets:
      signatures-token: ${{ secrets.CLA_SIGNATURES_TOKEN }}
