[package]
name = "orbyn-engineering"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license-file = "../../LICENSE"

[features]
# Technical testers opt in at build time; ordinary release builds have no inspector.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Reads the verified signature's trusted comment in app_update: minisign signatures are base64.
# The same version the updater plugin already builds with.
base64 = "0.23"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Snap Shot window capture (docs/snapshots.md, security queue row 30). Exact pin; no default features, so no async or version flags beyond macOS 14.
screencapturekit = { version = "=11.1.2", default-features = false, features = ["macos_14_0"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSThread"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

# Pull request desktop checks only (ORBYN_CARGO_PROFILE=ci-release in ci.yml): the release
# profile minus the link-time work that makes the bundle build slow. Main, nightly and
# release builds keep `release`.
[profile.ci-release]
inherits = "release"
codegen-units = 16
lto = "off"
