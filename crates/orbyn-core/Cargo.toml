[package]
name = "orbyn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
# Rows and a repository for the HTTP tests of orbynd.
test-support = []
# The Engine adapter and its dependency. Off in every normal build, release included, because
# nothing calls it while sign-in is off; the tests switch it on through the dev-dependency below.
engine-client = ["dep:orbyn-device-client"]

[dependencies]
orbyn-contracts = { path = "../orbyn-contracts" }
# The Engine's device client, by tag: the one Engine crate the app names (docs/account.md, "Engine pin").
orbyn-device-client = { git = "https://github.com/orbyn-dev/orbyn-engine", tag = "engine-v0.2.4", optional = true }
async-trait.workspace = true
base64 = "0.22"
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
icu_properties = "=2.4.0"
ignore = "=0.4.34"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
portable-pty.workspace = true
regex.workspace = true
regex-syntax.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
zeroize.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ulid.workspace = true
unicode-segmentation = "=1.13.3"
tar = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
orbyn-core = { path = ".", features = ["engine-client"] }
tokio = { workspace = true, features = ["test-util"] }
