[package]
name = "orbyn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
# Rows and a repository for the HTTP tests of orbynd.
test-support = []
# The Engine adapter and its dependency. Off in every normal build, release included, because
# nothing calls it while sign-in is off; the tests switch it on through the dev-dependency below.
# The macOS keychain behind the engine API-key setting (src/credentials). On in the service's normal
# build; on other platforms the dependency does not exist and the store says unavailable.
engine-credentials = ["dep:security-framework"]
engine-client = ["dep:orbyn-device-client", "dep:chacha20poly1305", "dep:security-framework"]

[dependencies]
orbyn-contracts = { path = "../orbyn-contracts" }
# The Engine's device client, by tag: the one Engine crate the app names (docs/account.md, "Engine pin").
orbyn-device-client = { git = "https://github.com/orbyn-dev/orbyn-engine", tag = "engine-v0.2.4", optional = true }
async-trait.workspace = true
# Seals the Engine snapshot on disk (docs/account.md, "The device and its keys"); the same crate and version the Engine uses.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
base64 = "0.22"
# The JSON Schema validator behind a `schema` check (docs/crew.md, "Verification without limits").
boon.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
icu_properties = "=2.4.0"
ignore = "=0.4.34"
notify = "=8.2.2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
portable-pty.workspace = true
regex.workspace = true
regex-syntax.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
zeroize.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ulid.workspace = true
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "=1.13.3"
tar = { version = "0.4", default-features = false }

# The macOS keychain behind the Engine adapter (docs/account.md, "The device and its keys"): the
# maintained, MIT or Apache-2.0 binding the rustls platform verifier already pulls into the desktop
# lock. Built with `engine-client` (no normal build) or `engine-credentials` (the service).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
orbyn-core = { path = ".", features = ["engine-client"] }
tokio = { workspace = true, features = ["test-util"] }
ts-rs.workspace = true
